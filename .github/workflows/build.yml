name: Build A20s Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex cpio zip python3 libssl-dev git

      - name: Fetch GCC 4.9 toolchains
        run: |
          mkdir -p $HOME/toolchains
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $HOME/toolchains/aarch64
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 $HOME/toolchains/arm

      - name: Setup KernelSU-Next legacy (v3.4.0-legacy)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.4.0-legacy/kernel/setup.sh" | bash -s v3.4.0-legacy

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$HOME/toolchains/aarch64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$HOME/toolchains/arm/bin/arm-linux-androideabi-
          make O=out a20s_eur_open_defconfig
          make -j$(nproc) O=out

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KSU-Next-Kernel-A20s.zip ./*
          cd ..
          mv KSU-Next-Kernel-A20s.zip out/

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Next-Kernel-A20s
          path: out/KSU-Next-Kernel-A20s.zip
          if-no-files-found: error
